_schema-version: 3.3.0
ID: SupplierResilience
description: A simple CAP project.
version: 1.0.4
modules:
  - name: SupplierResilience-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: SupplierResilience-auth
      - name: SupplierResilience-db
      - name: SupplierResilience-destination-service
      - name: SupplierResilience-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: SupplierResilience-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: SupplierResilience-db
    parameters:
      buildpack: nodejs_buildpack

  - name: SupplierResilience-destination-content
    type: com.sap.application.content
    requires:
      - name: SupplierResilience-destination-service
        parameters:
          content-target: true
      - name: SupplierResilience_html_repo_host
        parameters:
          service-key:
            name: SupplierResilience_html_repo_host-key
      - name: SupplierResilience-auth
        parameters:
          service-key:
            name: SupplierResilience-auth-key
      - name: srv-api
    parameters:
      content:
        instance:
          destinations:
            - Name: SupplierResilience_html_repo_host
              ServiceInstanceName: SupplierResilience-html5-app-host-service
              ServiceKeyName: SupplierResilience_html_repo_host-key
              sap.cloud.service: com.capgemini.supplierresilience
            - Authentication: OAuth2UserTokenExchange
              Name: SupplierResilience_uaa
              ServiceInstanceName: SupplierResilience-auth
              ServiceKeyName: SupplierResilience-auth-key
              sap.cloud.service: com.capgemini.supplierresilience
            - Name: SupplierResilience-srv-api
              URL: ~{srv-api/srv-url}
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: SupplierResilience-auth
              TokenServiceKeyName: SupplierResilience-auth-key
              sap.cloud.service: com.capgemini.supplierresilience
              HTML5.DynamicDestination: true
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  - name: supplierresilience-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: SupplierResilience_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - supplierresilience.zip
          name: supplierresilience
          target-path: resources/

  - name: supplierresilience
    type: html5
    path: app/supplierresilience
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []

resources:
  - name: SupplierResilience-auth
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

  - name: SupplierResilience-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: SupplierResilience-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ui5
                Type: HTTP
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                ProxyType: Internet
              # ─────────────────────────────────────────────────────────────
              # supplier_resilience_agent
              #
              # Points at the Python/FastAPI geo-agent deployed from the
              # Supplier_Resilience_EWA repo (feat/require-suppliers-from-cap
              # branch). Consumed by CAP's analyzeImpact orchestrator via
              # the @sap-cloud-sdk/http-client executeHttpRequest call.
              #
              # Replace the URL below with the actual CF route of the
              # deployed Python agent (e.g.
              # https://supplier-resilience-agent.cfapps.<region>.hana.ondemand.com)
              # either here or in the BTP Destination cockpit after deploy.
              # ─────────────────────────────────────────────────────────────
              - Name: supplier_resilience_agent
                Type: HTTP
                URL: https://supplier-resilience-agent.cfapps.eu10-004.hana.ondemand.com
                Authentication: NoAuthentication
                ProxyType: Internet
                HTML5.DynamicDestination: true
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: SupplierResilience-destination-service
      service-plan: lite

  - name: SupplierResilience_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: SupplierResilience-html5-app-host-service
      service-plan: app-host

  - name: SupplierResilience_html_repo_runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: SupplierResilience-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production